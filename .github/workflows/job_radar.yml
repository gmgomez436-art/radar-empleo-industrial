name: Radar Diario de Empleo

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  ejecutar-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Buscador y Generar CSV
        run: python buscador.py

      - name: Subir planilla como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: reporte-empleos-cordoba
          path: resultados_empleo.csv
