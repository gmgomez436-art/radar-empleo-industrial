name: Radar Diario de Empleo

on:
  schedule:
    - cron: '0 11 * * *' # Corre automáticamente todos los días a las 11:00 UTC (8:00 AM Argentina)
  workflow_dispatch: # Te permite ejecutarlo manualmente cuando quieras desde la pestaña Actions

jobs:
  ejecutar-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar Buscador
        run: python buscador.py
