name: Radar Diario de Empleo

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  ejecutar-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permite al bot guardar cambios en el repositorio

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar Buscador
        run: python buscador.py

      - name: Guardar resultados en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados_empleo.csv
          git commit -m "Actualizar reporte diario de empleo [skip ci]" || echo "Sin cambios para guardar"
          git push
